<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArbTracker Mobile</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #bb86fc;
            --positive-color: #03dac6;
            --warning-color: #cf6679;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
        }
        .container { max-width: 500px; margin: 0 auto; }
        .header { margin-bottom: 20px; }
        .bankroll-input {
            width: 100%;
            padding: 15px;
            background: var(--card-bg);
            border: 1px solid var(--accent-color);
            color: white;
            border-radius: 8px;
            font-size: 1.2rem;
            margin-top: 10px;
            box-sizing: border-box;
        }
        .arb-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 5px solid var(--positive-color);
        }
        .arb-card.palp { border-left-color: var(--warning-color); }
        .event-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 5px; }
        .roi { font-size: 1.5rem; color: var(--positive-color); margin-bottom: 10px; }
        .outcomes { display: grid; gap: 10px; margin-bottom: 15px; }
        .outcome { background: #333; padding: 10px; border-radius: 8px; }
        .btn-link {
            display: block;
            width: 100%;
            padding: 15px;
            text-align: center;
            background: var(--accent-color);
            color: black;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Total Bankroll</h2>
            <input type="number" id="bankroll" class="bankroll-input" value="100" onchange="renderArbs()">
        </div>
        <div id="arb-list"></div>
    </div>

    <script>
        let arbs = [];

        function getGubbingState() {
            return JSON.parse(localStorage.getItem("gubbing_state")) || { overrides: {}, learned: {} };
        }

        function setLimit(bookie, limit) {
            const state = getGubbingState();
            const val = parseFloat(limit);
            if (isNaN(val)) return;

            if (!state.overrides[bookie]) state.overrides[bookie] = [];
            state.overrides[bookie].push(val);

            if (state.overrides[bookie].length >= 5) {
                const sum = state.overrides[bookie].reduce((a, b) => a + b, 0);
                state.learned[bookie] = sum / state.overrides[bookie].length;
            }

            localStorage.setItem("gubbing_state", JSON.stringify(state));
            renderArbs();
        }

        async function fetchArbs() {
            try {
                const response = await fetch("arbs.json");
                arbs = await response.json();
                renderArbs();
            } catch (e) {
                console.error("Failed to load arbs.json", e);
                document.getElementById("arb-list").innerHTML = "<p>Error loading arbs.</p>";
            }
        }

        function roundToNearest10(num) {
            return Math.max(10, Math.round(num / 10) * 10);
        }

        function renderArbs() {
            const bankroll = parseFloat(document.getElementById("bankroll").value) || 0;
            const state = getGubbingState();
            const container = document.getElementById("arb-list");
            container.innerHTML = "";

            arbs.forEach(arb => {
                const multiplier = bankroll / 100;
                
                let s1 = arb.outcomes[0].raw_stake * multiplier;
                let s2 = arb.outcomes[1].raw_stake * multiplier;

                arb.outcomes.forEach((o, i) => {
                    let cap = null;
                    if (state.learned[o.bookmaker]) {
                        cap = state.learned[o.bookmaker] / (o.odds_decimal - 1);
                    } else if (state.overrides[o.bookmaker] && state.overrides[o.bookmaker].length > 0) {
                        cap = state.overrides[o.bookmaker][state.overrides[o.bookmaker].length - 1];
                    }
                    
                    if (cap) {
                        if (i === 0 && s1 > cap) s1 = cap;
                        if (i === 1 && s2 > cap) s2 = cap;
                    }
                });
                
                s2 = (s1 * arb.outcomes[0].odds_decimal) / arb.outcomes[1].odds_decimal;
                s1 = roundToNearest10(s1);
                s2 = roundToNearest10(s2);
                
                const payout1 = s1 * arb.outcomes[0].odds_decimal;
                const payout2 = s2 * arb.outcomes[1].odds_decimal;
                const totalRoundedStake = s1 + s2;
                const truePayout = Math.min(payout1, payout2);
                const trueROI = ((truePayout / totalRoundedStake) - 1) * 100;

                const card = document.createElement("div");
                card.className = `arb-card ${arb.palp_warning ? "palp" : ""}`;
                
                card.innerHTML = `
                    <div class="event-title">${arb.event}</div>
                    <div class="roi">${trueROI.toFixed(1)}% True ROI</div>
                    <div class="outcomes">
                        ${arb.outcomes.map((o, i) => `
                            <div class="outcome">
                                <div>
                                    ${o.name} (${o.bookmaker_title}) 
                                    ${state.learned[o.bookmaker] ? '<span style="color:red; font-weight:bold;">[GUBBED]</span>' : ''}
                                </div>
                                <div><strong>$${i === 0 ? s1 : s2}</strong> @ ${o.odds_decimal}</div>
                                <input type="number" class="limit-input" placeholder="Manual Limit" onchange="setLimit('${o.bookmaker}', this.value)">
                                <a href="#" class="btn-link" onclick="alert('Betting $${i === 0 ? s1 : s2} on ${o.bookmaker_title}')">Bet $${i === 0 ? s1 : s2} on ${o.bookmaker_title}</a>
                            </div>
                        `).join("")}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        fetchArbs();
    </script>
</body>
</html>
